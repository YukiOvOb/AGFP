<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AGFP</title>
<meta name="description" content="AGFP · Assignment Grading and Feedback Platform">
<style>
  :root {
    --bg0: #0b1020; --bg1: #121a33;
    --ink: #eef2ff; --muted: #9aa6c9;
    --a: #7c9cff; --b: #b388ff; --c: #5ee7d6;
    --glass: rgba(255,255,255,.06); --line: rgba(255,255,255,.12);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: "Inter", "PingFang SC", "Microsoft YaHei", -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--ink);
    background: radial-gradient(1200px 800px at 15% 10%, #1e2a5a 0%, transparent 60%),
                radial-gradient(1000px 700px at 85% 90%, #2a1a4a 0%, transparent 60%),
                linear-gradient(160deg, var(--bg0), var(--bg1));
    overflow: hidden;
    display: grid; place-items: center;
  }
  .orb {
    position: fixed; border-radius: 50%; filter: blur(70px); opacity: .55; pointer-events: none;
    animation: drift 18s ease-in-out infinite alternate;
  }
  .orb.a { width: 420px; height: 420px; background: var(--a); top: -120px; left: -100px; }
  .orb.b { width: 360px; height: 360px; background: var(--b); bottom: -120px; right: -80px; animation-delay: -6s; }
  .orb.c { width: 260px; height: 260px; background: var(--c); top: 55%; left: 8%; animation-delay: -12s; opacity: .35; }
  @keyframes drift { from { transform: translate(0,0) scale(1); } to { transform: translate(60px,-40px) scale(1.12); } }

  /* 语言切换：固定在右上角 */
  .lang {
    position: fixed; top: 20px; right: 20px; z-index: 10;
    display: inline-flex; padding: 4px; border-radius: 999px;
    background: rgba(255,255,255,.06); border: 1px solid var(--line);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  }
  .lang button {
    appearance: none; border: 0; cursor: pointer; font: inherit; font-size: 13px; font-weight: 600;
    padding: 7px 14px; border-radius: 999px; color: var(--muted); background: transparent;
    transition: color .2s, background .2s;
  }
  .lang button[aria-pressed="true"] { color: #0b1020; background: linear-gradient(90deg, var(--a), var(--c)); }
  .lang button:hover:not([aria-pressed="true"]) { color: var(--ink); }

  .card {
    position: relative; width: min(680px, 92vw); padding: 56px 48px;
    background: var(--glass); border: 1px solid var(--line); border-radius: 24px;
    backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
    box-shadow: 0 30px 80px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.08);
    text-align: center; animation: rise .9s cubic-bezier(.2,.8,.2,1) both;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: none; } }

  .badge {
    display: inline-flex; align-items: center; gap: 8px; padding: 6px 14px; border-radius: 999px;
    font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted);
    border: 1px solid var(--line); background: rgba(255,255,255,.04);
  }
  .badge i { width: 8px; height: 8px; border-radius: 50%; background: var(--c); box-shadow: 0 0 12px var(--c); animation: pulse 2s infinite; }
  @keyframes pulse { 50% { opacity: .35; } }

  h1 {
    margin: 26px 0 8px; font-size: clamp(40px, 8vw, 72px); font-weight: 800; letter-spacing: -.02em; line-height: 1.05;
    background: linear-gradient(90deg, var(--a), var(--b) 55%, var(--c));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .sub { margin: 0; font-size: clamp(16px, 2.4vw, 20px); color: var(--ink); opacity: .92; font-weight: 500; }
  .desc { margin: 12px 0 0; color: var(--muted); font-size: 15px; line-height: 1.7; }

  .chips { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 30px; }
  .chip {
    padding: 10px 16px; border-radius: 14px; font-size: 14px; color: var(--ink);
    background: rgba(255,255,255,.05); border: 1px solid var(--line); transition: transform .2s, background .2s;
  }
  .chip:hover { transform: translateY(-2px); background: rgba(255,255,255,.1); }
  .chip b { color: var(--c); margin-right: 6px; font-weight: 700; }

  .cta { margin-top: 34px; display: inline-flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
  .btn {
    padding: 12px 22px; border-radius: 12px; font-weight: 600; text-decoration: none; font-size: 15px;
    transition: transform .15s, box-shadow .15s;
  }
  .btn.primary { color: #0b1020; background: linear-gradient(90deg, var(--a), var(--c)); box-shadow: 0 10px 30px rgba(124,156,255,.35); }
  .btn.ghost { color: var(--ink); border: 1px solid var(--line); background: rgba(255,255,255,.04); }
  .btn:hover { transform: translateY(-2px); }

  footer { margin-top: 36px; font-size: 12px; color: var(--muted); letter-spacing: .04em; }
  footer code { color: var(--ink); opacity: .8; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }

  /* 切换时文字淡入 */
  [data-i18n] { transition: opacity .18s; }
  .swapping [data-i18n] { opacity: 0; }
</style>
</head>
<body>
  <div class="orb a"></div><div class="orb b"></div><div class="orb c"></div>

  <nav class="lang" aria-label="Language">
    <button type="button" data-lang="zh" aria-pressed="true">中文</button>
    <button type="button" data-lang="en" aria-pressed="false">EN</button>
  </nav>

  <main class="card">
    <span class="badge"><i></i> <span data-i18n="badge">在线 · 香港</span></span>
    <h1 data-i18n="title">欢迎来到 AGFP</h1>
    <p class="sub" data-i18n="sub">作业批改与反馈平台</p>
    <p class="desc" data-i18n="desc">把“收、批、评、改”做成一条流畅的闭环：<br>教师批得快，学生看得懂，反馈可追溯。</p>

    <div class="chips">
      <span class="chip"><b>01</b><span data-i18n="c1">作业提交与收集</span></span>
      <span class="chip"><b>02</b><span data-i18n="c2">智能辅助批改</span></span>
      <span class="chip"><b>03</b><span data-i18n="c3">结构化反馈</span></span>
      <span class="chip"><b>04</b><span data-i18n="c4">进度与数据看板</span></span>
    </div>

    <div class="cta">
      <a class="btn primary" href="#" data-i18n="enter">进入平台</a>
      <a class="btn ghost" href="https://github.com/YukiOvOb/AGFP" target="_blank" rel="noopener">GitHub</a>
    </div>

    <footer><span data-i18n="foot">自动部署自</span> <code>main</code> · serms.midas.cyou</footer>
  </main>

<script>
  const I18N = {
    zh: {
      badge: '在线 · 香港',
      title: '欢迎来到 AGFP',
      sub: '作业批改与反馈平台',
      desc: '把“收、批、评、改”做成一条流畅的闭环：<br>教师批得快，学生看得懂，反馈可追溯。',
      c1: '作业提交与收集', c2: '智能辅助批改', c3: '结构化反馈', c4: '进度与数据看板',
      enter: '进入平台', foot: '自动部署自',
    },
    en: {
      badge: 'Online · Hong Kong',
      title: 'Welcome to AGFP',
      sub: 'Assignment Grading and Feedback Platform',
      desc: 'Collect, grade, comment and revise in one smooth loop:<br>faster for teachers, clearer for students, fully traceable.',
      c1: 'Submission & Collection', c2: 'AI-assisted Grading', c3: 'Structured Feedback', c4: 'Progress Dashboard',
      enter: 'Enter Platform', foot: 'Deployed automatically from',
    },
  };
  const nodes = document.querySelectorAll('[data-i18n]');
  const buttons = document.querySelectorAll('.lang button');
  function apply(lang) {
    const t = I18N[lang] || I18N.zh;
    document.body.classList.add('swapping');
    setTimeout(() => {
      nodes.forEach(n => { n.innerHTML = t[n.dataset.i18n]; });
      document.documentElement.lang = lang === 'en' ? 'en' : 'zh-CN';
      buttons.forEach(b => b.setAttribute('aria-pressed', String(b.dataset.lang === lang)));
      document.body.classList.remove('swapping');
    }, 180);
    try { localStorage.setItem('agfp.lang', lang); } catch (_) {}
  }
  buttons.forEach(b => b.addEventListener('click', () => apply(b.dataset.lang)));
  let initial = 'zh';
  try { initial = localStorage.getItem('agfp.lang') || (navigator.language.startsWith('zh') ? 'zh' : 'en'); } catch (_) {}
  if (initial !== 'zh') apply(initial);
</script>
</body>
</html>
