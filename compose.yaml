# scripts/deploy.sh runs this on the server: docker compose up -d --build
# Compose automatically loads variables from .env in this directory. HOST_PORT defaults to 8789,
# bound only to 127.0.0.1, with nginx reverse-proxying https://serms.midas.cyou.
services:
  app:
    build: .
    image: agfp:latest
    container_name: agfp
    ports:
      - "127.0.0.1:${HOST_PORT:-8789}:8080"
    restart: unless-stopped
