name: Deploy
on:
  push:
    branches: [main]
    # Documentation-only pushes never deploy; a mixed push with any code change still does.
    paths-ignore: ['**.md', 'docs/**', '.agents/**', '.github/ISSUE_TEMPLATE/**']
  workflow_dispatch: {}
concurrency:
  group: deploy-production
  cancel-in-progress: false
permissions:
  contents: read
  checks: read
jobs:
  release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Reject non-main execution before checkout or secrets
        run: test "$GITHUB_REF" = refs/heads/main
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify handover and current main SHA checks
        run: node scripts/verify-release.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SERMS_PRODUCTION_READY: ${{ vars.SERMS_PRODUCTION_READY }}
  deploy:
    needs: release-gate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Require trusted host identity
        env:
          HOST_FINGERPRINT: ${{ secrets.DEPLOY_HOST_FINGERPRINT }}
        run: test -n "$HOST_FINGERPRINT"
      - name: Deploy verified main over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          RELEASE_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_PORT }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          fingerprint: ${{ secrets.DEPLOY_HOST_FINGERPRINT }}
          envs: RELEASE_SHA
          command_timeout: 20m
          script: |
            set -euo pipefail
            APP_DIR=/opt/agfp
            test -d "$APP_DIR/.git"
            test -f "$APP_DIR/.env"
            cd "$APP_DIR"
            git fetch origin main
            test "$(git rev-parse origin/main)" = "$RELEASE_SHA"
            RELEASE_SCRIPT=$(mktemp)
            trap 'rm -f "$RELEASE_SCRIPT"' EXIT
            git show "$RELEASE_SHA:scripts/deploy.sh" > "$RELEASE_SCRIPT"
            APP_DIR="$APP_DIR" bash "$RELEASE_SCRIPT"
