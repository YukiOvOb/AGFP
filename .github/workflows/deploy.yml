name: Deploy
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'frontend/**'
      - 'integration/notifications/src/main/java/**'
      - 'Dockerfile'
      - '.dockerignore'
      - 'compose.yaml'
      - 'web/**'
      - 'scripts/deploy.sh'
      - 'scripts/verify-release.mjs'
      - '.github/workflows/deploy.yml'
  workflow_dispatch: {}
concurrency:
  group: deploy-production
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  release-gate:
    if: github.ref == 'refs/heads/main' && vars.SERMS_PRODUCTION_READY == 'true'
    permissions:
      contents: read
      checks: read
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Reject non-main execution before checkout or secrets
        run: test "$GITHUB_REF" = refs/heads/main
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # actions/checkout v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # actions/setup-node v4
        with:
          node-version: '24'
      - name: Verify handover and current main SHA checks
        run: node scripts/verify-release.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SERMS_PRODUCTION_READY: ${{ vars.SERMS_PRODUCTION_READY }}
  deploy:
    needs: release-gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    steps:
      - name: Require trusted host identity
        env:
          HOST_FINGERPRINT: ${{ secrets.DEPLOY_HOST_FINGERPRINT }}
        run: test -n "$HOST_FINGERPRINT"
      - name: Deploy verified main over SSH
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17 # appleboy/ssh-action v1.2.0
        env:
          RELEASE_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_PORT }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          fingerprint: ${{ secrets.DEPLOY_HOST_FINGERPRINT }}
          envs: RELEASE_SHA
          command_timeout: 20m
          script: |
            set -euo pipefail
            APP_DIR=/opt/agfp
            test -d "$APP_DIR/.git"
            test -f "$APP_DIR/.env"
            cd "$APP_DIR"
            git fetch origin main
            test "$(git rev-parse origin/main)" = "$RELEASE_SHA"
            RELEASE_SCRIPT=$(mktemp)
            trap 'rm -f "$RELEASE_SCRIPT"' EXIT
            git show "$RELEASE_SHA:scripts/deploy.sh" > "$RELEASE_SCRIPT"
            APP_DIR="$APP_DIR" bash "$RELEASE_SCRIPT"
