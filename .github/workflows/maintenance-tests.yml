name: Maintenance PostgreSQL acceptance
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  maintenance-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: serms_uc04_test
          POSTGRES_USER: serms_test
          POSTGRES_PASSWORD: ci-only-${{ github.run_id }}
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U serms_test -d serms_uc04_test"
          --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      PGHOST: localhost
      PGUSER: serms_test
      PGDATABASE: serms_uc04_test
      PGPASSWORD: ci-only-${{ github.run_id }}
      SERMS_UC04_TEST_JDBC_URL: jdbc:postgresql://localhost:5432/serms_uc04_test
      SERMS_UC04_TEST_DB_USER: serms_test
      SERMS_UC04_TEST_DB_PASSWORD: ci-only-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Migrate the isolated database to the current schema
        run: |
          for migration in app/src/main/resources/db/migration/V*.sql; do
            psql -v ON_ERROR_STOP=1 -f "$migration"
          done
      - name: Verify UC04 rollback concurrency linked loans and equipment recovery
        run: mvn -B -f app/pom.xml -Puc04-postgres-it -Dit.test=MaintenancePostgresIT test-compile failsafe:integration-test failsafe:verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: maintenance-postgres-evidence
          path: app/target/failsafe-reports/
