name: Frontend and API contract
on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # actions/checkout v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Determine application scope
        id: scope
        run: node scripts/ci-scope.mjs
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # actions/setup-java v4
        if: steps.scope.outputs.run == 'true'
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Generate OpenAPI from backend tests
        if: steps.scope.outputs.run == 'true'
        run: ./mvnw -B verify
        working-directory: app
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # actions/setup-node v4
        if: steps.scope.outputs.run == 'true'
        with:
          node-version: '24'
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # pnpm/action-setup v4
        if: steps.scope.outputs.run == 'true'
        with:
          package_json_file: frontend/package.json
      - run: pnpm install --frozen-lockfile
        if: steps.scope.outputs.run == 'true'
        working-directory: frontend
      - run: pnpm check:api
        if: steps.scope.outputs.run == 'true'
        working-directory: frontend
        env:
          OPENAPI_FILE: ../app/target/openapi.json
      - run: pnpm lint && pnpm typecheck && pnpm test && pnpm build
        if: steps.scope.outputs.run == 'true'
        working-directory: frontend
      - run: pnpm exec playwright install --with-deps chromium
        if: steps.scope.outputs.run == 'true'
        working-directory: frontend
      - run: pnpm test:e2e
        if: steps.scope.outputs.run == 'true'
        working-directory: frontend
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # actions/upload-artifact v4
        if: always() && steps.scope.outputs.run == 'true'
        with:
          name: frontend-and-api-evidence
          retention-days: 7
          path: |
            app/target/openapi.json
            app/target/surefire-reports/
            frontend/playwright-report/
            frontend/test-results/
