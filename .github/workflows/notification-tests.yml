name: Notification and default PostgreSQL tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  java-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Prepare PostgreSQL 18 image for Testcontainers
        run: docker pull postgres:18-alpine
        timeout-minutes: 10
      - name: Regression and default PostgreSQL 18 application integration
        run: mvn -B -f app/pom.xml -Puc03-postgres-it clean verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: notification-test-evidence
          path: |
            app/target/surefire-reports/
            app/target/failsafe-reports/
            app/target/site/jacoco/
