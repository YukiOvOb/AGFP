name: Notification and default PostgreSQL tests
on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  java-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # actions/checkout v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Determine application scope
        id: scope
        run: node scripts/ci-scope.mjs
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # actions/setup-java v4
        if: steps.scope.outputs.run == 'true'
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Regression and default PostgreSQL 18 application integration
        if: steps.scope.outputs.run == 'true'
        run: mvn -B -f app/pom.xml -Puc03-postgres-it clean verify
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # actions/upload-artifact v4
        if: always() && steps.scope.outputs.run == 'true'
        with:
          name: notification-test-evidence
          retention-days: 7
          path: |
            app/target/surefire-reports/
            app/target/failsafe-reports/
            app/target/site/jacoco/

  # Preserve the protected UC03 check name without executing the same suite twice.
  checkout-return:
    needs: java-tests
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Require the shared PostgreSQL regression to pass
        env:
          REGRESSION_RESULT: ${{ needs.java-tests.result }}
        run: test "$REGRESSION_RESULT" = success
