name: Collaboration documentation
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  collaboration-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check collaboration links and skill entry points
        run: node scripts/check-collaboration.mjs
