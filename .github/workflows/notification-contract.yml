name: Notification PostgreSQL contract
on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  notification-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # actions/checkout v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Determine application scope
        id: scope
        run: node scripts/ci-scope.mjs
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # actions/setup-java v4
        if: steps.scope.outputs.run == 'true'
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: integration/notifications/pom.xml
      - name: Fetch the pinned notification contract
        if: steps.scope.outputs.run == 'true'
        run: git fetch --no-tags origin 01b50778701ed8a729039790238581bb59e929b5
      - name: Test actual upstream services with PostgreSQL
        if: steps.scope.outputs.run == 'true'
        shell: pwsh
        run: ./scripts/test-notification-integration.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # actions/upload-artifact v4
        if: always() && steps.scope.outputs.run == 'true'
        with:
          name: notification-postgres-contract
          retention-days: 7
          path: integration/notifications/target/surefire-reports/
