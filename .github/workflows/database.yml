name: Sprint 1 database
on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  database-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: serms_test
          POSTGRES_USER: serms_test
          POSTGRES_PASSWORD: ci-only-${{ github.run_id }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U serms_test -d serms_test"
          --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      SERMS_TEST_JDBC_URL: jdbc:postgresql://localhost:5432/serms_test
      SERMS_TEST_DB_USER: serms_test
      SERMS_TEST_DB_PASSWORD: ci-only-${{ github.run_id }}
      PGHOST: localhost
      PGUSER: serms_test
      PGDATABASE: serms_test
      PGPASSWORD: ci-only-${{ github.run_id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # actions/checkout v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Determine application scope
        id: scope
        run: node scripts/ci-scope.mjs
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # actions/setup-java v4
        if: steps.scope.outputs.run == 'true'
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: database/pom.xml
      - name: Verify existing-data upgrade and empty database initialization
        if: steps.scope.outputs.run == 'true'
        run: |
          psql -v ON_ERROR_STOP=1 -f app/src/main/resources/db/migration/V001__sprint1.sql
          psql -v ON_ERROR_STOP=1 -f database/src/test/resources/v1-upgrade-fixture.sql
          psql -v ON_ERROR_STOP=1 -f app/src/main/resources/db/migration/V002__align_serms_model.sql
          createdb serms_empty
          for migration in app/src/main/resources/db/migration/V*.sql; do
            psql -d serms_empty -v ON_ERROR_STOP=1 -f "$migration"
          done
      - name: Build and test with real PostgreSQL
        if: steps.scope.outputs.run == 'true'
        run: mvn -B -f database/pom.xml clean verify
      - name: Verify V004 preserves immutable approval history
        if: steps.scope.outputs.run == 'true'
        run: |
          psql -v ON_ERROR_STOP=1 -f database/src/test/resources/v4-upgrade-fixture.sql
          psql -v ON_ERROR_STOP=1 -f app/src/main/resources/db/migration/V004__loan_operations.sql
          psql -v ON_ERROR_STOP=1 -f database/src/test/resources/v4-upgrade-assertions.sql
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # actions/upload-artifact v4
        if: always() && steps.scope.outputs.run == 'true'
        with:
          name: sprint1-database-tests
          retention-days: 7
          path: database/target/surefire-reports/
