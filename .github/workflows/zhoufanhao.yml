name: Zhou Fanhao UC03 integration
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  checkout-return:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: app/pom.xml
      - name: Application regression and full PostgreSQL UC03 integration
        run: mvn -B -f app/pom.xml -Puc03-postgres-it verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zhoufanhao-uc03-tests
          path: |
            app/target/surefire-reports/
            app/target/failsafe-reports/
            app/target/site/jacoco/
