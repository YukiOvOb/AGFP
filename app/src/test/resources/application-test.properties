# Isolated notification/HTTP mapping regression only; real domain integration uses PostgreSQL 18.
spring.datasource.url=jdbc:h2:mem:serms;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.hikari.connection-init-sql=SET SCHEMA public
spring.jpa.properties.hibernate.default_schema=public
serms.identity.schema=public
serms.approval.enabled=false
spring.datasource.username=sa
spring.datasource.password=
serms.notifications.worker-enabled=false

spring.flyway.locations=classpath:db/notification-test
spring.flyway.table=flyway_schema_history

serms.security.secure-cookies=false
server.servlet.session.cookie.secure=false
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true
