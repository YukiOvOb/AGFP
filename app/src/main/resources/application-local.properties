# Transitional notification-only H2 profile; replace after the shared PostgreSQL 18 migration.
spring.datasource.url=jdbc:h2:file:./data/serms;MODE=MySQL;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=

spring.flyway.locations=classpath:db/migration

serms.security.secure-cookies=false
server.servlet.session.cookie.secure=false
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true
