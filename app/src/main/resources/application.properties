spring.application.name=serms
server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${SERVER_PORT:8081}
spring.datasource.url=${SERMS_DB_URL:jdbc:mysql://localhost:3306/serms?connectionTimeZone=UTC}
spring.datasource.username=${SERMS_DB_USER:serms}
spring.datasource.password=${SERMS_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true
server.error.include-message=never
server.error.include-stacktrace=never
serms.notifications.worker-enabled=true

spring.flyway.locations=classpath:db/migration,classpath:db/mysql

# Public API and session contract. Database switch remains owned by the shared migration PR.
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=30m
springdoc.api-docs.path=/api/v1/openapi.json
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false
management.endpoints.web.base-path=/api/v1
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
