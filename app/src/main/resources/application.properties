spring.application.name=serms
server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${SERVER_PORT:8081}
spring.profiles.default=serms-postgres
spring.profiles.group.local=serms-postgres
spring.datasource.url=${SERMS_DB_URL:jdbc:postgresql://127.0.0.1:55432/serms?currentSchema=serms,public}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.connection-init-sql=SET search_path TO serms, public
spring.jpa.properties.hibernate.default_schema=serms
serms.identity.schema=serms
spring.datasource.username=${SERMS_DB_USER:serms}
spring.datasource.password=${SERMS_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true
server.error.include-message=never
server.error.include-stacktrace=never
serms.notifications.worker-enabled=true

# The shared PostgreSQL schema and real approval persistence are installed.
serms.approval.enabled=${SERMS_APPROVAL_ENABLED:true}
# First-admin bootstrap (#41): set for one start on an empty database, then remove. Blank = off.
serms.bootstrap.admin.email=${SERMS_BOOTSTRAP_ADMIN_EMAIL:}
serms.bootstrap.admin.display-name=${SERMS_BOOTSTRAP_ADMIN_DISPLAY_NAME:}
serms.bootstrap.admin.password=${SERMS_BOOTSTRAP_ADMIN_PASSWORD:}

spring.flyway.locations=classpath:db/migration
spring.flyway.default-schema=public
spring.flyway.table=serms_flyway_history
spring.flyway.baseline-on-migrate=false

# Public API and session contract.
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=30m
springdoc.api-docs.path=/api/v1/openapi.json
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false
management.endpoints.web.base-path=/api/v1
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# Boot 4 / Jackson 3 preserves the existing JSON response defaults.
spring.jackson.use-jackson2-defaults=true
springdoc.api-docs.version=OPENAPI_3_0
