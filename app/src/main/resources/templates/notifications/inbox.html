<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Notifications')}"></head><body>
<header th:replace="~{fragments/layout :: header}"></header><main>
<div class="page-heading"><div><p class="eyebrow">YOUR WORKSPACE</p><h1>Notifications</h1><p class="lead">Equipment updates and return reminders, all in one place.</p></div><form th:action="@{/logout}" method="post"><button class="secondary" type="submit">Sign out</button></form></div>
<section class="panel empty" th:if="${#lists.isEmpty(notifications)}"><span class="empty-icon" aria-hidden="true">✓</span><h2>No notifications here</h2><p>Delivered equipment updates will appear here.</p></section>
<section class="panel table-wrap" th:unless="${#lists.isEmpty(notifications)}"><table><caption class="sr-only">Your delivered notifications</caption><thead><tr><th scope="col">Message</th><th scope="col">Delivered (UTC)</th><th scope="col">Status</th><th scope="col">Action</th></tr></thead><tbody>
<tr th:each="notification : ${notifications}"><td><span class="eyebrow" th:text="${#strings.replace(notification.type.name(), '_', ' ')}"></span><p th:text="${notification.content}"></p></td><td th:text="${notification.deliveredAt}"></td><td><span class="badge" th:text="${notification.readAt == null ? 'Unread' : 'Read'}"></span></td><td><form th:if="${notification.readAt == null}" th:action="@{/notifications/{id}/read(id=${notification.id})}" method="post"><button class="secondary" type="submit">Mark as read</button></form><span th:unless="${notification.readAt == null}">Reviewed</span></td></tr>
</tbody></table></section>
<nav class="pagination" aria-label="Inbox pages"><a th:if="${page > 0}" th:href="@{/notifications(page=${page - 1})}">← Previous</a><span th:text="'Page ' + ${page + 1}"></span><a th:if="${notifications.size() == 20 and page < 10000}" th:href="@{/notifications(page=${page + 1})}">Next →</a></nav>
</main><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
