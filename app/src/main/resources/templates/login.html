<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Sign in')}"></head><body><header th:replace="~{fragments/layout :: header}"></header><main>
<p class="eyebrow">YOUR WORKSPACE</p><h1>Welcome back.</h1><p class="lead">Sign in to view your equipment notifications.</p>
<form class="panel login-form" th:action="@{/login}" method="post"><p role="alert" th:if="${param.error}">Unable to sign in. Check your username and password.</p><p role="status" th:if="${param.logout}">You have signed out.</p><label for="username">Username</label><input id="username" name="username" autocomplete="username" required><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required><button type="submit">Sign in</button></form>
</main><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
