# Activate alongside the unmodified notification application with --spring.profiles.active=serms-postgres.
spring.datasource.url=${SERMS_DB_URL:jdbc:postgresql://127.0.0.1:55432/serms?currentSchema=serms,public}
spring.datasource.username=${SERMS_DB_USER:serms}
spring.datasource.password=${SERMS_DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=serms
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.locations=classpath:db/serms-shared,classpath:db/serms-notification
spring.flyway.default-schema=public
spring.flyway.table=serms_flyway_history
spring.flyway.baseline-on-migrate=false
serms.notifications.due-soon-lead=PT24H
spring.datasource.hikari.connection-init-sql=SET search_path TO serms, public
